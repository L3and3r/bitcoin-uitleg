<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- VUL: titel -->
<title>TITEL | l3and3r.org</title>
<style>
  :root {
    --bg:#0a0a0a; --fg:#cccccc; --kop:#ffffff; --muted:#999999; --subtiel:#666666;
    --accent:#f7931a; --accent-hover:#ffa726; --accent-2:#63a4ff;
    --card:rgba(255,255,255,0.03); --card-accent:rgba(247,147,26,0.05);
    --border:rgba(247,147,26,0.2);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:16px; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height:1.6;
  }
  .widget {
    max-width:720px; margin:0 auto; background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:20px;
  }
  h1 { font-size:1.35rem; font-weight:700; color:var(--kop); margin:0 0 .25rem; }
  .context { color:var(--muted); margin:0 0 1.25rem; }
  .resultaat { font-size:2rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); }
  .duiding { font-weight:600; margin:.5rem 0 1rem; }
  label { display:block; font-weight:600; margin-top:1rem; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button {
    font:inherit; font-weight:600; padding:.55rem 1rem; border-radius:8px;
    border:1px solid var(--accent); background:var(--accent); color:#0a0a0a; cursor:pointer;
  }
  button:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  .voetnoot { font-size:.85rem; color:var(--muted); border-top:1px solid var(--border); margin-top:1.5rem; padding-top:.75rem; }
  code, .mono { font-family:ui-monospace, 'Cascadia Code', Consolas, monospace; }
</style>
</head>
<body>
<main class="widget">
  <!-- VUL: kop (bij voorkeur als vraag) -->
  <h1>KOP</h1>
  <!-- VUL: één zin context -->
  <p class="context">CONTEXT</p>

  <!-- VUL: interactie (zie references/didactiek.md voor het patroon) -->
  <section id="interactie"></section>

  <!-- VUL: duiding, verandert mee met de invoer -->
  <p class="duiding" id="duiding" aria-live="polite"></p>

  <footer class="voetnoot">
    <!-- VUL: aannames, bron, peildatum -->
    <p>Aannames: … Peildatum: …</p>
    <!-- Bij rekenwidgets laten staan, anders verwijderen -->
    <p>Dit is een rekenvoorbeeld ter uitleg, geen financieel advies.</p>
  </footer>
</main>

<script>
  // Getalnotatie volgens references/huisstijl.md
  const eur  = n => new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR' }).format(n);
  const sats = n => new Intl.NumberFormat('nl-NL', { maximumFractionDigits:0 }).format(n) + ' sats';
  const btc  = n => new Intl.NumberFormat('nl-NL', { maximumFractionDigits:8 }).format(n) + ' BTC';
  const pct  = n => new Intl.NumberFormat('nl-NL', { maximumFractionDigits:1 }).format(n) + '%';

  // Optionele opslag: altijd binnen try/catch
  const opslag = {
    lees(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // VUL: widgetlogica
  function render() {
  }
  render();
</script>
</body>
</html>
